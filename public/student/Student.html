    <style>
        /* 视频播放器样式 */
        .center-top.public-bg {
            position: relative;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .public-title1 {
            padding: 8px;
            margin: 0;
        }

        .course-selector {
            padding: 8px;
            margin: 0;
            margin-top: 35px;
            margin-left: 30px;
            display: flex;
            gap: 10px;
            justify-content: flex-start;
            align-items: center;
        }

        .video-player-container {
            width: 93%;
            height: calc(100% - 145px);
            margin: 0 3.5%;
            padding: 0;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .video-player {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            margin: 0;
            margin-top: 10%;
            padding: 0;
            border: none;
        }

        .data-select {
            padding: 0 8px;
            border: 1px solid #0e94ea;
            background: transparent;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            height: 28px;
            line-height: 26px;
            box-sizing: border-box;
            display: inline-block;
            min-height: 28px;
            margin-top: 2px;
        }

        .data-select:hover {
            background: #0e94ea;
        }

        .data-select option {
            background: #001a2f;
            color: #fff;
        }

        /* 待办清单样式 */
        .task-input-container {
            display: flex;
            padding: 0;
            margin: 0;
            align-items: center;
            height: 32px;
            gap: 8px;
            width: 100%;
            margin-top: 5px;
        }

        .new-task-input {
            flex: 1;
            padding: 0 8px;
            border: 1px solid #0e94ea;
            background: transparent;
            color: #fff;
            border-radius: 4px;
            height: 28px;
            line-height: 28px;
            box-sizing: border-box;
            min-height: 28px;
            display: inline-block;
            margin-top: 2px;
        }

        #taskList li {
            position: relative;
            padding: 5px;
            margin: 5px 0;
            display: flex;
            align-items: center;
            transition: opacity 0.5s;
        }

        .task-text {
            flex: 1;
            margin: 0 10px;
        }

        .checkbox {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .task-complete {
            opacity: 0.6;
        }

        .edit-input {
            flex: 1;
            margin: 0 10px;
            padding: 2px 5px;
            border: 1px solid #0e94ea;
            background: transparent;
            color: #fff;
            border-radius: 3px;
        }

        .subtitle {
            position: relative;
            width: 100%;
            height: 400px;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #videoPlaceholder {
            font-size: 16px;
            color: #666;
        }

        #teacherVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-controls {
            margin-top: 10px;
            text-align: center;
        }

        #cameraBtn {
            padding: 8px 16px;
            background-color: #409EFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        #cameraBtn:hover {
            background-color: #66b1ff;
        }
    </style>
</head>

<script src="https://www.jq22.com/jquery/echarts-4.2.1.min.js"></script>
<script src="https://www.jq22.com/jquery/jquery-1.10.2.js"></script>
<script type="text/javascript" src="js/china.js"></script>
<script type="text/javascript" src="js/Shuaxing.js"></script>

<script type="text/javascript" src="js/leidatu.js"></script>

<script>
    //顶部时间
    function getTime() {
        var nowTime = '2025年04月23日&nbsp;&nbsp;11:57:34&nbsp;&nbsp;星期三&nbsp;&nbsp;';
        $('#time').html(nowTime);
    };
    //大屏
    setInterval(getTime, 1000);

    // 处理课程回放加载
    function loadPlayback() {
        const date = document.getElementById('dateSelect').value;
        const course = document.getElementById('courseSelect').value;

        if (!date || !course) {
            alert('请选择日期和课程！');
            return;
        }

        // 设置视频源
        const videoPlayer = document.getElementById('videoPlayer');
        // 使用相对路径访问教师端的视频文件
        videoPlayer.src = `../teacher/videos/${date}_${course}.mp4`;

        console.log(`加载 ${date} 的 ${course} 课程回放`);
    }

    // 刷新右侧三个图表
    function refreshRightCharts() {
        // 刷新课堂情况占比情况
        if (typeof piechart5 === 'function') {
            // 清除原有图表
            var pieChart = echarts.init(document.getElementById('piechart5'));
            pieChart.clear();
            // 重新初始化
            piechart5();
        }

        // 刷新与上节课相比数据
        if (typeof huaxing === 'function') {
            // 清除原有图表
            var huaxingChart = echarts.init(document.getElementById('huaxing'));
            huaxingChart.clear();
            // 重新初始化
            huaxing();
        }

        // 刷新PK情况
        if (typeof leidatu === 'function') {
            // 清除原有图表
            var pkChart = echarts.init(document.getElementById('leidatu'));
            pkChart.clear();
            // 重新初始化
            leidatu();
        }
    }

    // 摄像头控制
    let stream = null;
    const video = document.getElementById('teacherVideo');
    const placeholder = document.getElementById('videoPlaceholder');
    const cameraBtn = document.getElementById('cameraBtn');

    async function toggleCamera() {
        if (!stream) {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                video.srcObject = stream;
                video.style.display = 'block';
                placeholder.style.display = 'none';
                cameraBtn.innerHTML = '<i class="fas fa-video-slash"></i> 关闭摄像头';
                video.play();
            } catch (err) {
                console.error('摄像头访问错误:', err);
                alert('无法访问摄像头：' + err.message);
            }
        } else {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
            video.srcObject = null;
            video.style.display = 'none';
            placeholder.style.display = 'block';
            cameraBtn.innerHTML = '<i class="fas fa-video"></i> 开启摄像头';
        }
    }
</script>
